name: SonarCloud Scan

run-name: "SonarCloud Scan (${{ github.event.client_payload.dispatch_id }})"

on:
  repository_dispatch:
    types: [code_quality_sonar_scan]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write snippets to disk
        run: |
          mkdir -p submissions
          cat <<'EOF' > snippets.json
          ${{ toJson(github.event.client_payload.snippets) }}
          EOF
          python3 - <<'PY'
          import json, pathlib
          data = json.load(open('snippets.json'))
          ext_map = {
              'python': 'py', 'javascript': 'js', 'typescript': 'ts',
              'java': 'java', 'go': 'go', 'ruby': 'rb', 'c': 'c', 'cpp': 'cpp',
          }
          for s in data:
              ext = ext_map.get(s.get('language', 'python'), 'txt')
              path = pathlib.Path('submissions') / f"{s['name']}.{ext}"
              path.write_text(s['code'])
          PY

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Wait for analysis + fetch issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, base64, os

          host = "https://sonarcloud.io"
          token = os.environ["SONAR_TOKEN"]
          auth = base64.b64encode(f"{token}:".encode()).decode()
          headers = {"Authorization": f"Basic {auth}"}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          report = {}
          for line in open('.scannerwork/report-task.txt'):
              if '=' in line:
                  k, v = line.strip().split('=', 1)
                  report[k] = v

          task_id = report['ceTaskId']
          project_key = report['projectKey']

          # Poll the background task until analysis finishes
          for _ in range(30):
              task = get(f"{host}/api/ce/task?id={task_id}")['task']
              if task['status'] == 'SUCCESS':
                  break
              if task['status'] in ('FAILED', 'CANCELED'):
                  raise SystemExit(f"SonarCloud analysis {task['status']}")
              time.sleep(5)
          else:
              raise SystemExit("Timed out waiting for SonarCloud analysis")

          issues = get(
              f"{host}/api/issues/search?componentKeys={project_key}&ps=500"
          )['issues']

          sev_map = {
              'BLOCKER': 'error', 'CRITICAL': 'error',
              'MAJOR': 'warning',
              'MINOR': 'info', 'INFO': 'info',
          }
          sev_label = {
              'BLOCKER': 'ERROR', 'CRITICAL': 'ERROR',
              'MAJOR': 'WARNING',
              'MINOR': 'INFO', 'INFO': 'INFO',
          }

          import pathlib
          out = {}
          for f in sorted(pathlib.Path('submissions').iterdir()):
              name = f.stem
              out[name] = {
                  'linesOfCode': sum(1 for _ in open(f)),
                  'critical': 0, 'error': 0, 'warning': 0, 'info': 0,
                  'totalFindings': 0, 'findings': [],
              }

          for issue in issues:
              component = issue['component']  # "<projectKey>:submissions/Name.ext"
              path = component.split(':', 1)[-1]
              name = pathlib.Path(path).stem
              if name not in out:
                  continue
              sev = issue.get('severity', 'INFO')
              key = sev_map.get(sev, 'info')
              out[name][key] += 1
              out[name]['totalFindings'] += 1
              out[name]['findings'].append({
                  'severity': sev_label.get(sev, 'INFO'),
                  'message': issue.get('message', ''),
                  'line': issue.get('line'),
                  'rule': issue.get('rule', ''),
              })

          json.dump(out, open('results.json', 'w'), indent=2)
          PY

      - name: Publish results to the repo
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('results.json', 'utf8');
            const dispatchId = context.payload.client_payload.dispatch_id;
            const path = `results/${dispatchId}-sonar.json`;

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `SonarCloud results for ${dispatchId}`,
              content: Buffer.from(content, 'utf8').toString('base64'),
              branch: 'main',
            });
